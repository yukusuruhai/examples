version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: yuksuruhai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Aktifkan dukungan GPU NVIDIA jika host memiliki driver nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:
